<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>ReviveGo - Sign Up</title>
    </head>

    <body>
        <h1>ReviveGo</h1>
        <h2>Sign up </h2>

        <form action = "home.html" method = "get">
              <p>Full name: <input type="text" name="name"></p>
              <p>Phone number: <input type="tel" name="phone"></p>
              <p>Email: <input type="email" name="email"></p>
              <p>Charger type:
                <select name="charger">
                    <option>USB-C</option>
                    <option>Lightning</option>
                </select>
            </p>
            <p>Zip code: <input type="text" name="zip"> or <input type="checkbox" name="gps"> use GPS</p>
            <p><input type="checkbox" name="courier"> I want to be a courier</p>
            <p><i>(couriers: you will add payment receiving details and ID verification after this)</i></p>
            <p><button type="submit">Create account</button></p>
        </form>

        <p><a href="home.html">Already have an account? Log in</a></p>
    </body>
</html>
